name: Publish to TestPyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+a[0-9]+'  # alpha releases only (e.g. 2.0.0a1)

concurrency:
  group: testpypi-publish
  cancel-in-progress: true

jobs:
  # JOB 0: Read project metadata from pyproject.toml
  read-metadata:
    name: Read pyproject.toml metadata
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.meta.outputs.package-name }}
      smoke-test-cmds: ${{ steps.meta.outputs.smoke-test-cmds }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract metadata from pyproject.toml
        id: meta
        shell: python3 {0}
        run: |
          import tomllib, os

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          project = data["project"]
          name = project["name"]
          cmds = " ".join(project.get("scripts", {}).keys())

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"package-name={name}", file=out)
              print(f"smoke-test-cmds={cmds}", file=out)

  # JOB 1: Pre-Deployment Validation (Safety Gate)
  run-unit-tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: read-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetches all history and tags so dynamic versioning works

      - name: Verify version tag matches TOML declaration
        shell: python3 {0}
        run: |
          import tomllib, os, sys

          with open("pyproject.toml", "rb") as f:
              source = tomllib.load(f)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          if tag != source:
              print(f"Version mismatch: tag={tag}, pyproject.toml={source}")
              sys.exit(1)

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install local package and testing tools
        run: |
          uv pip install --system pytest pytest-cov
          uv pip install --system -e .

      - name: Run test suite
        run: pytest

  # JOB 2: Deployment (Only runs if Job 1 passes)
  build-n-publish:
    name: Build and publish Python distro to TestPyPI
    needs: [read-metadata, run-unit-tests]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.read-metadata.outputs.package-name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Build binary wheels and source tarball
        run: uv build  # Delegates to the build backend in pyproject.toml (hatchling, flit, etc.)

      - name: Publish to TestPyPI via uv
        run: uv publish --publish-url https://test.pypi.org/legacy/

  # JOB 3: Post-Deployment Smoke Test (Verifies index installation and packaging)
  verify-deployment:
    name: Verify Live Package (${{ matrix.os }})
    needs: [read-metadata, build-n-publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Delay execution for index propagation
        if: runner.os != 'Windows'
        run: sleep 30

      - name: Delay execution for index propagation (Windows)
        if: runner.os == 'Windows'
        run: Start-Sleep -Seconds 30

      - name: Install deployed package from TestPyPI
        run: |
          uv pip install --system \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            --prerelease allow \
            ${{ needs.read-metadata.outputs.package-name }}

      - name: Smoke test CLI entry points
        shell: bash
        run: |
          for cmd in ${{ needs.read-metadata.outputs.smoke-test-cmds }}; do
            echo "→ $cmd --version"
            "$cmd" --version
          done