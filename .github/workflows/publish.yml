---
name: Publish
run-name: Publish version ${{ github.ref_name }}
"on":
  release:
    types: [published]
concurrency:
  group: publish
  cancel-in-progress: true
permissions: {} # deny all by default; each job grants only what it needs
jobs:
  # JOB 0: Run the full CI suite as a safety gate for every channel
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  # JOB 1: Read project metadata from pyproject.toml
  read-metadata:
    name: Read pyproject.toml metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.meta.outputs.package-name }}
      smoke-test-cmds: ${{ steps.meta.outputs.smoke-test-cmds }}
      version: ${{ steps.meta.outputs.version }}
      python-versions: ${{ steps.meta.outputs.python-versions }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract metadata from pyproject.toml
        id: meta
        shell: python3 {0}
        run: |
          import json, re, tomllib, os

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          project = data["project"]
          name = project["name"]
          version = project["version"]
          cmds = " ".join(project.get("scripts", {}).keys())

          # Derive the floor and ceiling of the supported Python range from the
          # Trove classifiers.
          pattern = re.compile(r"Programming Language :: Python :: (\d+\.\d+)$")
          pys = sorted(
              (m.group(1) for c in project.get("classifiers", []) if (m := pattern.match(c))),
              key=lambda v: tuple(int(p) for p in v.split(".")),
          )
          python_versions = json.dumps([pys[0], pys[-1]] if pys else [])

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"package-name={name}", file=out)
              print(f"smoke-test-cmds={cmds}", file=out)
              print(f"version={version}", file=out)
              print(f"python-versions={python_versions}", file=out)
  # ---------------------------------------------------------------- PyPI ----
  # JOB 2: Verify tag, build and publish (only runs if CI passes)
  publish-pypi:
    name: Build and publish Python distro to PyPI
    needs: [ci, read-metadata]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.read-metadata.outputs.package-name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag matches declared version
        env:
          DECLARED_VERSION: ${{ needs.read-metadata.outputs.version }}
        shell: python3 {0}
        run: |
          import os, sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = os.environ["DECLARED_VERSION"]
          if tag != version:
              print(f"Version mismatch: tag={tag}, declared={version}")
              sys.exit(1)
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false # disabled to prevent cache poisoning
          ignore-empty-workdir: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: pyproject.toml
      - name: Build binary wheels and source tarball
        run: uv build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
      - name: Publish to PyPI via uv
        run: uv publish
  # JOB 3: Post-deployment smoke test (verifies index installation and packaging)
  verify-pypi-install:
    name: Verify Live Package (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [read-metadata, publish-pypi]
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor and ceiling of the support range, derived from Trove classifiers
        python-version: ${{ fromJSON(needs.read-metadata.outputs.python-versions) }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false # disabled on publish workflows to prevent cache poisoning
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deployed package from PyPI
        env:
          PACKAGE_NAME: ${{ needs.read-metadata.outputs.package-name }}
          VERSION: ${{ needs.read-metadata.outputs.version }}
        shell: bash
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=15

          for i in $(seq 1 $MAX_RETRIES); do
            # --refresh-package bypasses uv's cached index listing so each retry
            # re-fetches from PyPI and can see the freshly published version.
            if uv pip install --system --refresh-package "$PACKAGE_NAME" "$PACKAGE_NAME==$VERSION"; then
              echo "Package installed successfully from PyPI."
              exit 0
            fi
            echo "Index not yet updated. Retrying in $RETRY_INTERVAL seconds... ($i/$MAX_RETRIES)"
            sleep $RETRY_INTERVAL
          done

          echo "Package failed to propagate after $((MAX_RETRIES * RETRY_INTERVAL)) seconds."
          exit 1
      - name: Smoke test CLI entry points
        env:
          SMOKE_TEST_CMDS: ${{ needs.read-metadata.outputs.smoke-test-cmds }}
        shell: bash
        run: |
          for cmd in $SMOKE_TEST_CMDS; do
            echo "→ $cmd --version"
            "$cmd" --version
          done
  # ------------------------------------------------------------ Homebrew ----
  # JOB 4: Generate the formula and push it to the tap. Runs in parallel with
  # the PyPI channel: the formula builds from the GitHub release tarball, which
  # exists the moment `release: published` fires, so there is nothing to wait on.
  publish-homebrew:
    name: Generate and push Homebrew formula
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: homebrew
      url: https://github.com/lucuma13/homebrew-dit
    outputs:
      formula-name: ${{ steps.generate.outputs.name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout homebrew-dit tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucuma13/homebrew-dit
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-dit
          persist-credentials: false
      - name: Generate formula from pyproject.toml + uv.lock
        id: generate
        run: |
          FILENAME=$(python3 scripts/create_homebrew_formula.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --output-dir homebrew-dit/Formula)
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "name=${FILENAME%.rb}" >> "$GITHUB_OUTPUT"
      - name: Commit and push formula
        working-directory: homebrew-dit
        env:
          FORMULA_FILENAME: ${{ steps.generate.outputs.filename }}
          FORMULA_NAME: ${{ steps.generate.outputs.name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_FILENAME}"
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to push."
            exit 0
          fi
          git commit -m "${FORMULA_NAME} ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/lucuma13/homebrew-dit" HEAD:main
  # JOB 5: Post-deployment smoke test (install the pushed formula from the tap)
  verify-brew-install:
    name: Verify brew install (macos-latest)
    needs: [read-metadata, publish-homebrew]
    runs-on: macos-latest
    permissions: {}
    steps:
      - name: Install from tap
        env:
          FORMULA_NAME: ${{ needs.publish-homebrew.outputs.formula-name }}
        run: |
          brew tap lucuma13/dit
          brew install --build-from-source "lucuma13/dit/${FORMULA_NAME}"
      - name: Smoke test CLI entry points
        env:
          SMOKE_TEST_CMDS: ${{ needs.read-metadata.outputs.smoke-test-cmds }}
        shell: bash
        run: |
          for cmd in $SMOKE_TEST_CMDS; do
            echo "→ $cmd --version"
            "$cmd" --version
          done
