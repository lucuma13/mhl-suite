name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-publish
  cancel-in-progress: true

permissions: {}  # deny all by default; each job grants only what it needs

jobs:
  # JOB 0: Read project metadata from pyproject.toml
  read-metadata:
    name: Read pyproject.toml metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.meta.outputs.package-name }}
      smoke-test-cmds: ${{ steps.meta.outputs.smoke-test-cmds }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Extract metadata from pyproject.toml
        id: meta
        shell: python3 {0}
        run: |
          import tomllib, os

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          project = data["project"]
          name = project["name"]
          version = project["version"]
          cmds = " ".join(project.get("scripts", {}).keys())

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"package-name={name}", file=out)
              print(f"smoke-test-cmds={cmds}", file=out)
              print(f"version={version}", file=out)

  # JOB 1: Pre-Deployment Validation (Safety Gate)
  run-unit-tests:
    name: Unit Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: read-metadata
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Fetches all history and tags so dynamic versioning works
          persist-credentials: false

      - name: Verify release tag matches declared version
        env:
          DECLARED_VERSION: ${{ needs.read-metadata.outputs.version }}
        shell: python3 {0}
        run: |
          import os, sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = os.environ["DECLARED_VERSION"]
          if tag != version:
              print(f"Version mismatch: tag={tag}, declared={version}")
              sys.exit(1)

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install local package and testing tools
        run: |
          uv pip install --system pytest pytest-cov
          uv pip install --system -e .

      - name: Run test suite
        run: pytest

  # JOB 2: Deployment (Only runs if Job 1 passes)
  build-n-publish:
    name: Build and publish Python distro to PyPI
    needs: [read-metadata, run-unit-tests]
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.read-metadata.outputs.package-name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false  # disabled on publish workflows to prevent cache poisoning

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Build binary wheels and source tarball
        run: uv build

      - name: Publish to PyPI via uv
        run: uv publish

  # JOB 3: Post-Deployment Smoke Test (Verifies index installation and packaging)
  verify-deployment:
    name: Verify Live Package (${{ matrix.os }})
    needs: [read-metadata, build-n-publish]
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: false  # disabled on publish workflows to prevent cache poisoning

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Delay execution for index propagation
        shell: bash
        run: sleep 30

      - name: Install deployed package from PyPI
        env:
          PACKAGE_NAME: ${{ needs.read-metadata.outputs.package-name }}
        shell: bash
        run: uv pip install --system "$PACKAGE_NAME"

      - name: Smoke test CLI entry points
        env:
          SMOKE_TEST_CMDS: ${{ needs.read-metadata.outputs.smoke-test-cmds }}
        shell: bash
        run: |
          for cmd in $SMOKE_TEST_CMDS; do
            echo "→ $cmd --version"
            "$cmd" --version
          done
