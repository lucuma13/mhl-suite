[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mhl-suite"
version = "1.4.0"
description = "Simple MHL verification and sealing tools"
readme = "README.md"
keywords = [
  "asc-mhl",
  "ascmhl",
  "c4",
  "checksum",
  "classic-mhl",
  "flat-mhl",
  "legacy-mhl",
  "md5",
  "media-hash-list",
  "mhl",
  "mhl-suite",
  "mhl-tool",
  "mhlver",
  "sha1",
  "simple-mhl",
  "xxhash",
  "xxhash3",
  "xxhash64",
  "xxhash128",
]
license = { text = "MIT" }
authors = [ { name = "Luis Gómez Gutiérrez" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.1.7",
  "lxml>=6.1.1",
  "pathspec>=0.8",
  "python-dateutil>=2.8.2",
  "rich>=15",
  "xxhash>=3.7.1",
]
urls.Homepage = "https://github.com/lucuma13/mhl-suite"
scripts.mhlver = "mhl_suite.cli.mhlver:main"
scripts.simple-mhl = "mhl_suite.cli.simple_mhl:main"

[dependency-groups]
dev = [
  "hypothesis",
  "lxml-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "taplo",
  "ty",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/mhl_suite/" ]
build.targets.sdist.include = [ "/src/mhl_suite/", "/tests/" ]
build.targets.sdist.exclude = [ "/.github/" ]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
# Vendored upstream ASC-MHL engine (synced ~verbatim from github.com/ascmhl/mhl
# v1.2; see src/mhl_suite/ascmhl/vendor/LICENSE and VENDOR.md). The whole vendor/
# dir is excluded from lint/format so the suite's strict rules don't force-rewrite
# third-party code and break re-syncing; new upstream files are covered automatically.
# Our own ASC-MHL code (ascmhl/verify.py, ascmhl/sizecheck.py) sits outside vendor/
# and IS linted.
extend-exclude = [ "src/mhl_suite/ascmhl/vendor" ]
lint.select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C",    # flake8-comprehensions + mccabe
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "FLY",  # flynt
  "FURB", # refurb
  "I",    # isort
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
lint.ignore = [
  "PLR0911", # too many return statements — flat status dispatch, not real complexity
  "PLR0912", # too many branches — independent dispatch arms, not nested complexity
  "PLR0913", # too many arguments — internal pipeline functions, dataclass would add noise
  "PLR0915", # too many statements — procedural orchestration, not real complexity
  "PTH",     # os.scandir has benchmarked performance improvements over pathlib
  "S603",    # subprocess of a path-resolved backend binary, never shell=True
]
lint.per-file-ignores."tests/*.py" = [
  "ANN",     # annotations on tests add noise without value
  "PLR2004", # exact values in assertions are the point
  "S101",    # asserts are the point of a test
  "S311",    # random is for fuzz-data generation, not cryptography
  "S324",    # md5 is a valid MHL algorithm the tests exercise, not a security boundary
]
lint.mccabe.max-complexity = 15  # Cyclomatic-complexity ceiling

[tool.typos]
default.extend-ignore-re = [ '\b[0-9a-fA-F]{8,}\b' ]  # Hash digests
default.extend-words.Nd = "Nd"  # "Number, decimal digit" Unicode category in Hypothesis strategy

[tool.ty]
# Don't type-check the vendored upstream ASC-MHL engine (see [tool.ruff]
# extend-exclude for the rationale). Our own ascmhl/verify.py & ascmhl/sizecheck.py
# sit outside vendor/ and stay checked.
src.exclude = [ "src/mhl_suite/ascmhl/vendor" ]

[tool.pytest]
ini_options.addopts = "--strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml"
