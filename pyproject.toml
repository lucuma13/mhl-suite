[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mhl-suite"
version = "1.2.0a4"
description = "Simple MHL verification and sealing tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ascmhl>=1.2",
  "lxml>=6.1.1",
  "rich>=15",
  "xxhash>=3.7",
]
[[project.authors]]
name = "Luis Gómez Gutiérrez"
[project.scripts]
mhlver = "mhl_suite.mhlver:main"
simple-mhl = "mhl_suite.simple_mhl:main"
[project.urls]
Homepage = "https://github.com/lucuma13/mhl-suite"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[tool.hatch]
[tool.hatch.build]
targets.wheel.packages = [ "src/mhl_suite" ]
targets.sdist.include = [
  "src/mhl_suite/",
  "tests/",
]

[tool.uv]
managed = true

[tool.ty]
[tool.ty.src]
include = [ "src", "tests" ]

[tool.pytest]
[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]
addopts = "--strict-markers --cov=src --cov-branch --cov-report=term-missing"
