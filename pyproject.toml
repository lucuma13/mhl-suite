[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mhl-suite"
version = "1.3.0"
description = "Simple MHL verification and sealing tools"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Luis Gómez Gutiérrez" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ascmhl>=1.2",
  "lxml>=6.1.1",
  "rich>=15",
  "xxhash>=3.7",
]
urls.Homepage = "https://github.com/lucuma13/mhl-suite"
scripts.mhlver = "mhl_suite.mhlver:main"
scripts.simple-mhl = "mhl_suite.simple_mhl:main"

[dependency-groups]
dev = [
  "hypothesis",
  "lxml-stubs",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
  "taplo",
  "ty",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/mhl_suite" ]
build.targets.sdist.include = [ "src/mhl_suite/", "tests/" ]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
lint.select = [ "ANN", "B", "BLE", "C", "E", "F", "FURB", "I", "PL", "PT", "RUF", "SIM", "UP", "W" ]
lint.ignore = [
  "PLR0911", # too many return statements — flat status dispatch, not real complexity
  "PLR0912", # too many branches — independent dispatch arms, not nested complexity
  "PLR0913", # too many arguments — internal pipeline functions, dataclass would add noise
  "PLR0915", # too many statements — procedural orchestration, not real complexity
  "PTH",     # os.scandir has benchmarked performance improvements over pathlib
]
lint.per-file-ignores."tests/*.py" = [
  "ANN",     # annotations on tests add noise without value
  "PLR2004", # exact values in assertions are the point
]

[tool.pytest]
ini_options.addopts = "--strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml"
