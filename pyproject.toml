[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "mhl-suite"
version = "1.2.0a4"
description = "Simple MHL verification and sealing tools"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Luis Gómez Gutiérrez" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ascmhl>=1.2",
  "lxml>=6.1.1",
  "rich>=15",
  "xxhash>=3.7",
]
urls.Homepage = "https://github.com/lucuma13/mhl-suite"
scripts.mhlver = "mhl_suite.mhlver:main"
scripts.simple-mhl = "mhl_suite.simple_mhl:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/mhl_suite" ]
build.targets.sdist.include = [
  "src/mhl_suite/",
  "tests/",
]

[tool.uv]
managed = true

[tool.ty]
src.include = [ "src", "tests" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "--strict-markers --cov=src --cov-branch --cov-report=term-missing"
